<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lovable Clone - AI Code Generator</title>

    <!-- External Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            background: linear-gradient(180deg,
                #1a1a2e 0%,
                #2d3561 20%,
                #4a5f8c 40%,
                #6b7bb4 55%,
                #d946a6 75%,
                #ff4d88 90%,
                #ff6ba9 100%
            );
        }

        /* The "Heart Shaped" Gradient Blobs */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                /* Top Left Blue/Purple Lobe */
                radial-gradient(circle at 25% 30%, rgba(91, 123, 180, 0.6) 0%, transparent 50%),
                /* Top Right Blue/Purple Lobe */
                radial-gradient(circle at 75% 30%, rgba(91, 123, 180, 0.6) 0%, transparent 50%),
                /* Bottom Center Pink Point */
                radial-gradient(circle at 50% 85%, rgba(255, 77, 136, 0.5) 0%, transparent 60%),
                /* Extra pink glow */
                radial-gradient(circle at 50% 70%, rgba(233, 30, 99, 0.4) 0%, transparent 55%);
            filter: blur(80px);
            z-index: 0;
            animation: breathe 8s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.08); }
        }

        /* Helper for heart-shaped images */
        .heart-shaped-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            /* SVG mask for a perfect heart shape */
            mask: url("data:image/svg+xml;utf8,<svg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>") center/contain no-repeat;
            -webkit-mask: url("data:image/svg+xml;utf8,<svg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>") center/contain no-repeat;
        }

        .app-layout {
            display: flex;
            gap: 20px;
            max-width: 1800px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* History Sidebar */
        .history-sidebar {
            width: 280px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            padding: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        .history-sidebar.collapsed {
            width: 60px;
            padding: 20px 10px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .history-title {
            font-size: 1.1em;
            font-weight: 600;
            color: white;
        }

        .history-sidebar.collapsed .history-title,
        .history-sidebar.collapsed .history-item-content {
            display: none;
        }

        .toggle-history-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .toggle-history-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .history-item.active {
            background: rgba(217, 70, 166, 0.2);
            border-color: rgba(217, 70, 166, 0.4);
        }

        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .history-item-prompt {
            color: white;
            font-size: 0.9em;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            flex: 1;
        }

        .history-item-delete {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 1.2em;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .history-item-delete:hover {
            background: rgba(235, 51, 73, 0.2);
            color: #eb3349;
        }

        .history-item-time {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75em;
            margin-top: 6px;
        }

        .history-item-files {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8em;
            margin-top: 6px;
        }

        .history-empty {
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            padding: 30px 10px;
            font-size: 0.9em;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-title {
            text-align: center;
            font-size: 3.5em;
            font-weight: 400;
            color: white;
            letter-spacing: -0.02em;
            line-height: 1.2;
            animation: fadeIn 0.8s ease-in;
        }

        .input-container {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 20px 30px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        #promptInput {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.1em;
            font-family: inherit;
            outline: none;
            padding: 5px 0;
            resize: none;
            min-height: 70px;
            line-height: 1.5;
        }

        #promptInput::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        #promptInput::-webkit-scrollbar {
            width: 4px;
        }

        #promptInput::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .toolbar-left, .toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .submit-button {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .submit-button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .submit-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Split View Container */
        .split-view {
            display: flex;
            gap: 20px;
            min-height: 500px;
        }

        .results-panel {
            flex: 1;
            min-width: 0;
        }

        .preview-panel {
            flex: 1;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 300px);
            transition: all 0.3s ease;
        }

        .preview-panel.collapsed {
            flex: 0;
            min-width: 50px;
            overflow: hidden;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .preview-title {
            font-size: 1.1em;
            font-weight: 600;
            color: white;
        }

        .preview-actions {
            display: flex;
            gap: 8px;
        }

        .preview-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .preview-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .file-tabs {
            display: flex;
            gap: 4px;
            padding: 10px 15px;
            overflow-x: auto;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .file-tabs::-webkit-scrollbar {
            height: 4px;
        }

        .file-tabs::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .file-tab {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85em;
            white-space: nowrap;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .file-tab:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .file-tab.active {
            background: rgba(217, 70, 166, 0.2);
            border-color: rgba(217, 70, 166, 0.4);
            color: white;
        }

        .file-content-container {
            flex: 1;
            overflow: auto;
            padding: 20px;
        }

        .file-content {
            display: none;
        }

        .file-content.active {
            display: block;
        }

        .code-block {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .code-filename {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
            font-family: 'Courier New', monospace;
        }

        .code-actions {
            display: flex;
            gap: 8px;
        }

        .code-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s ease;
        }

        .code-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .code-pre {
            margin: 0;
            padding: 16px;
            overflow-x: auto;
        }

        .code-pre code {
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .results-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .results {
            display: none;
            animation: slideIn 0.4s ease-out;
        }

        .results.visible {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: 500;
            animation: fadeIn 0.3s ease-in;
            color: white;
        }

        .message.success {
            background: rgba(56, 239, 125, 0.2);
            border: 1px solid rgba(56, 239, 125, 0.3);
        }

        .message.error {
            background: rgba(235, 51, 73, 0.2);
            border: 1px solid rgba(235, 51, 73, 0.3);
        }

        .section-title {
            font-size: 1.2em;
            color: white;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .download-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .download-btn {
            background: rgba(56, 239, 125, 0.2);
            border: 1px solid rgba(56, 239, 125, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover {
            background: rgba(56, 239, 125, 0.3);
            transform: translateY(-2px);
        }

        .file-stats {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9em;
        }

        .files-list {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .file-item {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            transition: all 0.2s ease;
            color: white;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .file-item:last-child {
            margin-bottom: 0;
        }

        .file-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .file-icon {
            font-size: 1.2em;
            flex-shrink: 0;
        }

        .file-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-item-actions {
            display: flex;
            gap: 6px;
        }

        .file-action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.2s ease;
        }

        .file-action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .messages-list {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }

        .message-item {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            margin-bottom: 8px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
        }

        .message-item:last-child {
            margin-bottom: 0;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.5);
            font-style: italic;
        }

        /* Editor Modal */
        .editor-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .editor-modal.active {
            display: flex;
        }

        .editor-container {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            width: 100%;
            max-width: 1200px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .editor-title {
            color: white;
            font-size: 1.2em;
            font-weight: 600;
        }

        .editor-close {
            background: rgba(235, 51, 73, 0.2);
            border: 1px solid rgba(235, 51, 73, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .editor-close:hover {
            background: rgba(235, 51, 73, 0.3);
        }

        .editor-content {
            flex: 1;
            overflow: hidden;
        }

        .CodeMirror {
            height: 100%;
            font-size: 14px;
        }

        /* Scrollbar styling */
        .messages-list::-webkit-scrollbar,
        .file-content-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-list::-webkit-scrollbar-track,
        .file-content-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .messages-list::-webkit-scrollbar-thumb,
        .file-content-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .history-sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .history-sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        /* Responsive design */
        @media (max-width: 1400px) {
            .split-view {
                flex-direction: column;
            }

            .preview-panel {
                max-height: 600px;
            }
        }

        @media (max-width: 1024px) {
            .app-layout {
                flex-direction: column;
            }

            .history-sidebar {
                width: 100%;
                max-height: 300px;
            }

            .history-sidebar.collapsed {
                width: 100%;
                max-height: 60px;
            }
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5em;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar-left, .toolbar-right {
                justify-content: center;
            }

            .download-section {
                flex-direction: column;
                align-items: stretch;
            }

            .file-tabs {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- History Sidebar -->
        <aside class="history-sidebar" id="historySidebar">
            <div class="history-header">
                <h3 class="history-title">History</h3>
                <button class="toggle-history-btn" id="toggleHistoryBtn" title="Toggle sidebar">
                    <span id="toggleHistoryIcon">◀</span>
                </button>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty">No history yet</div>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="main-content">
            <h1 class="hero-title">Time to ship, Charles</h1>

            <div class="input-container">
                <div class="input-wrapper">
                    <textarea
                        id="promptInput"
                        placeholder="Ask Lovable to create a prototype..."
                        rows="3"
                        autocomplete="off"
                    ></textarea>
                </div>

                <div class="toolbar">
                    <div class="toolbar-left">
                        <button class="icon-button" id="addBtn">
                            <span>+</span>
                        </button>
                        <button class="icon-button" id="attachBtn">
                            <span>📎</span> Attach
                        </button>
                        <button class="icon-button" id="themeBtn">
                            <span>🎨</span> Theme
                        </button>
                    </div>

                    <div class="toolbar-right">
                        <button class="icon-button" id="chatBtn">
                            <span>💬</span> Chat
                        </button>
                        <button class="submit-button" id="generateBtn" title="Generate">
                            <span>↑</span>
                        </button>
                    </div>
                </div>
            </div>

            <div id="results" class="results" style="display: none;">
                <div class="split-view">
                    <!-- Results Panel -->
                    <div class="results-panel">
                        <div class="results-container">
                            <div id="statusMessage" class="message"></div>

                            <div id="downloadSection" style="display: none;">
                                <div class="download-section">
                                    <button class="download-btn" id="downloadAllBtn">
                                        <span>📦</span> Download All Files
                                    </button>
                                    <div class="file-stats" id="fileStats"></div>
                                </div>
                            </div>

                            <div id="filesSection" style="display: none;">
                                <h3 class="section-title">Generated Files</h3>
                                <div id="filesList" class="files-list"></div>
                            </div>

                            <div id="messagesSection" style="display: none;">
                                <h3 class="section-title">Agent Messages</h3>
                                <div id="messagesList" class="messages-list"></div>
                            </div>
                        </div>
                    </div>

                    <!-- File Preview Panel -->
                    <div class="preview-panel" id="previewPanel">
                        <div class="preview-header">
                            <h3 class="preview-title">File Preview</h3>
                            <div class="preview-actions">
                                <button class="preview-btn" id="togglePreviewBtn" title="Collapse panel">
                                    <span>▶</span>
                                </button>
                            </div>
                        </div>
                        <div class="file-tabs" id="fileTabs"></div>
                        <div class="file-content-container" id="fileContentContainer">
                            <div class="empty-state">Select a file to preview</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Editor Modal -->
    <div class="editor-modal" id="editorModal">
        <div class="editor-container">
            <div class="editor-header">
                <h3 class="editor-title" id="editorTitle">Edit File</h3>
                <button class="editor-close" id="editorCloseBtn">Close</button>
            </div>
            <div class="editor-content">
                <textarea id="codeEditor"></textarea>
            </div>
        </div>
    </div>

    <!-- External Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-tsx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>

    <script src="app.js"></script>
</body>
